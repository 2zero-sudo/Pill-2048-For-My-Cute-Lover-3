<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2zero 咖啡 - 皮克敏超級花園 極限版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f7fee7; overflow: hidden; overscroll-behavior: none; touch-action: none; color: #166534; }
        
        /* 全螢幕背景與毛玻璃 */
        .screen { display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; position: fixed; top: 0; left: 0; padding: 20px; overflow-y: auto; backdrop-filter: blur(10px); background: rgba(247, 254, 231, 0.8); z-index: 100; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
        .main-bg { background: linear-gradient(135deg, #ecfccb 0%, #a7f3d0 100%); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 遊戲盤面：復古格線參照樣式 */
        .grid-container { 
            display: grid; background-color: #a5d6a7; border-radius: 16px; padding: 12px; 
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.15); position: relative;
            margin: 0 auto;
        }

        /* 先前的格線樣式 */
        .grid-cell { background-color: rgba(255,255,255,0.3); border-radius: 8px; border: 1px solid rgba(22, 101, 52, 0.05); }

        /* 立體卡片樣式 */
        .tile { position: absolute; transition: all 0.1s ease-in-out; z-index: 10; }
        .tile-inner { 
            width: 100%; height: 100%; border-radius: 10px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15); position: relative;
            animation: appear 0.15s ease-out;
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        /* 📍 本次更新：愛心容器整體放大與位置調整 */
        .heart-container { 
            position: absolute; 
            bottom: -2px; /* 稍微超出邊界一點點，增加立體感 */
            right: -2px; 
            color: #ff80ab; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 20; /* 確保在 Emoji 之上 */
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2)); /* 增加陰影，讓數字更清晰 */
        }
        
        @keyframes appear { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* 主選單立體按鈕 */
        .btn-main { width: 260px; padding: 18px; margin: 12px 0; border-radius: 24px; font-weight: 900; font-size: 1.25rem; transition: all 0.2s; box-shadow: 0 6px 0 #166534; position: relative; z-index: 10; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #166534; }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 #166534; }

        /* 模式選擇卡片 */
        .mode-card { p: 6; border-radius: 32px; border-width: 2px; border-color: #d9f99d; transition: all 0.2s; background: rgba(255,255,255,0.9); }
        .mode-card:hover { transform: translateY(-4px); border-color: #84cc16; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="main-bg flex items-center justify-center min-h-screen">

    <div id="screen-main" class="screen active justify-center">
        <div class="text-center mb-16">
            <p class="text-[10px] text-green-700 font-bold tracking-[0.3em] uppercase opacity-60">2zero Coffee Presents</p>
            <h1 class="text-5xl font-black text-green-800 mb-2 leading-tight">皮克敏花園</h1>
            <p class="text-green-600 font-bold tracking-tighter text-sm">SUPER GARDEN 2^20</p>
        </div>
        
        <div class="flex flex-col items-center">
            <button onclick="showScreen('screen-modes')" class="btn-main bg-green-600 text-white">
                <i class="fas fa-play mr-3"></i> 開始種植
            </button>
            <button onclick="showRankings()" class="btn-main bg-white text-green-700">
                <i class="fas fa-trophy mr-3 text-yellow-500"></i> 成就榮譽榜
            </button>
            <button onclick="showScreen('screen-guide')" class="btn-main bg-green-100 text-green-800 text-lg py-4">
                <i class="fas fa-book-open mr-3"></i> 花園說明
            </button>
        </div>
        
        <footer class="absolute bottom-6 text-center text-[10px] text-green-700 opacity-50 uppercase tracking-widest">Powered by 2zero & AI</footer>
    </div>

    <div id="screen-modes" class="screen justify-center">
        <h2 class="text-3xl font-black text-green-800 mb-10 leading-none">選擇種植區域</h2>
        <div class="grid grid-cols-2 gap-5 w-full max-w-sm px-4">
            <button onclick="startGame(4)" class="mode-card p-6 flex flex-col items-center shadow-lg bg-white">
                <div class="text-4xl mb-3">🌱</div>
                <div class="font-black text-lg text-green-800">Classic</div>
                <div class="text-xs text-green-500">4x4 經典模式</div>
            </button>
            <button onclick="startGame(5)" class="mode-card p-6 flex flex-col items-center shadow-lg bg-white">
                <div class="text-4xl mb-3">🌸</div>
                <div class="font-black text-lg text-green-800">Flower</div>
                <div class="text-xs text-green-500">5x5 進階花園</div>
            </button>
            <button onclick="startGame(8)" class="mode-card p-6 flex flex-col items-center shadow-lg bg-white">
                <div class="text-4xl mb-3">🌲</div>
                <div class="font-black text-lg text-green-800">Forest</div>
                <div class="text-xs text-green-500">8x8 森林規模</div>
            </button>
            <button onclick="startGame(16)" class="mode-card p-6 flex flex-col items-center shadow-lg bg-white">
                <div class="text-4xl mb-3">🌎</div>
                <div class="font-black text-lg text-green-800">Galaxy</div>
                <div class="text-xs text-green-500">16x16 無限大地</div>
            </button>
        </div>
        <button onclick="showScreen('screen-main')" class="mt-12 text-green-700 font-bold underline text-sm tracking-wider">返回主選單</button>
    </div>

    <div id="screen-game" class="screen bg-white">
        <header class="w-full max-w-[380px] mt-6 mb-6 px-3 flex justify-between items-center bg-green-50/50 p-4 rounded-3xl border border-green-100 shadow-sm">
            <button onclick="saveAndExit()" class="text-xs text-green-800 font-bold py-2 px-3 bg-white rounded-full shadow active:scale-95 transition"><i class="fas fa-chevron-left mr-1"></i>選單</button>
            
            <div class="flex gap-3 text-right">
                <div class="bg-green-100/70 px-3 py-1.5 rounded-xl border border-green-200">
                    <span class="text-[9px] font-black text-green-600 block uppercase tracking-wider">Score</span>
                    <span id="score" class="text-2xl font-black text-green-900 leading-none">0</span>
                </div>
                <div class="bg-yellow-100 px-3 py-1.5 rounded-xl border border-yellow-200">
                    <span class="text-[9px] font-black text-yellow-700 block uppercase tracking-wider">Best</span>
                    <span id="best-score" class="text-2xl font-black text-yellow-800 leading-none">0</span>
                </div>
            </div>
        </header>
        
        <div id="game-board" class="grid-container"></div>
        
        <div class="flex gap-4 mt-8 w-full max-w-[380px] px-3">
            <button onclick="undo()" class="flex-1 py-4 bg-white border-2 border-green-100 text-green-700 rounded-2xl font-black active:scale-95 shadow-sm">
                <i class="fas fa-undo mr-1.5"></i> 反悔一步
            </button>
            <button onclick="initGame(true)" class="flex-1 py-4 bg-green-600 text-white rounded-2xl font-black active:scale-95 shadow-lg">
                重新開始
            </button>
        </div>
    </div>

    <div id="screen-rankings" class="screen justify-center">
        <h2 class="text-3xl font-black text-green-800 mb-5 leading-none">成就英雄榜</h2>
        <div class="flex gap-2.5 mb-5 overflow-x-auto w-full pb-2 max-w-sm px-3">
            <button onclick="updateRankDisplay(4)" class="px-5 py-2 bg-green-600 text-white rounded-full font-bold text-xs whitespace-nowrap shadow">4x4 Classic</button>
            <button onclick="updateRankDisplay(5)" class="px-5 py-2 bg-green-200 text-green-800 rounded-full font-bold text-xs whitespace-nowrap">5x5 Flower</button>
            <button onclick="updateRankDisplay(8)" class="px-5 py-2 bg-green-200 text-green-800 rounded-full font-bold text-xs whitespace-nowrap">8x8 Forest</button>
            <button onclick="updateRankDisplay(16)" class="px-5 py-2 bg-green-200 text-green-800 rounded-full font-bold text-xs whitespace-nowrap">16x16 Galaxy</button>
        </div>
        <div id="rank-content" class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-xl min-h-[360px] border border-green-100"></div>
        <button onclick="showScreen('screen-main')" class="mt-8 btn-main bg-green-600 text-white shadow-lg">返回首頁</button>
    </div>

    <div id="screen-guide" class="screen justify-center">
        <h2 class="text-3xl font-black text-green-800 mb-8 leading-none">種植指南</h2>
        <div class="bg-white p-7 rounded-3xl shadow-xl text-green-900 space-y-5 max-w-sm border border-green-100 leading-relaxed text-sm">
            <p class="flex items-start"><span class="text-xl mr-3">🖐️</span><span>在盤面上<b>上下左右滑動</b>，相同的皮克敏會合併升級為更強大的品種。</span></p>
            <p class="flex items-start"><span class="text-xl mr-3">👑</span><span>目標是進化出最終等級 $2^{20}$ ($1,048,576$) 的皇冠品種。</span></p>
            <p class="flex items-start"><span class="text-xl mr-3">🏆</span><span>每次遊戲結束都會結算精華點數 (分數)，越大的地圖可以獲得越多點數。</span></p>
            <p class="flex items-start"><span class="text-xl mr-3">💾</span><span>系統會隨時自動保存各模式的進度，下次開啟可直接繼續。</span></p>
        </div>
        <button onclick="showScreen('screen-main')" class="mt-10 btn-main bg-green-600 text-white shadow-lg">我明白了</button>
    </div>

<script>
    let currentSize = 4;
    let board = [];
    let score = 0;
    let history = [];
    
    // 生成皮克敏數據直到 2^20
    const pikminEmojis = ["🌱", "🍃", "🌸", "💛", "💙", "❤️", "💎", "🦋", "👾", "🌟", "👑", "🍀", "🍎", "🍊", "🍄", "🔥", "🌈", "🌌", "🪐", "⚡", "✨"];
    const pikminData = {};
    for(let i=1; i<=20; i++) {
        pikminData[Math.pow(2, i)] = pikminEmojis[i-1] || "🌀";
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startGame(size) {
        currentSize = size;
        showScreen('screen-game');
        initGame();
    }

    function saveAndExit() {
        if(confirm("進度已自動儲存，確定要暫停遊戲並返回選單嗎？")) {
            showScreen('screen-main');
        }
    }

    function initGame(forceReset = false) {
        const best = localStorage.getItem(`pikmin_2048_best_${currentSize}`) || 0;
        document.getElementById('best-score').innerText = best;

        const saved = localStorage.getItem(`pikmin_save_super_${currentSize}`);
        if(saved && !forceReset) {
            const data = JSON.parse(saved);
            board = data.board;
            score = data.score;
            history = data.history || [];
        } else {
            board = Array(currentSize).fill(0).map(() => Array(currentSize).fill(0));
            score = 0;
            history = [];
            addRandomTile(); addRandomTile();
        }
        render();
    }

    function addRandomTile() {
        let empty = [];
        for(let r=0; r<currentSize; r++) for(let c=0; c<currentSize; c++) if(board[r][c]===0) empty.push({r,c});
        if(empty.length > 0) {
            let {r, c} = empty[Math.floor(Math.random()*empty.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
        }
    }

    function render() {
        const container = document.getElementById('game-board');
        container.innerHTML = '';
        const viewportWidth = window.innerWidth;
        const boardSize = Math.min(viewportWidth - 40, 370);
        const gapSize = currentSize > 8 ? 2 : 6;
        const paddingSize = 10;
        const cellSize = (boardSize - paddingSize*2 - (currentSize-1)*gapSize) / currentSize;
        
        container.style.width = boardSize + 'px';
        container.style.height = boardSize + 'px';
        container.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
        container.style.gap = gapSize + 'px';
        container.style.padding = paddingSize + 'px';

        // 1. 背景格線參照先前樣式
        for(let i=0; i<currentSize*currentSize; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.style.width = cellSize + 'px';
            cell.style.height = cellSize + 'px';
            container.appendChild(cell);
        }

        const tileLayer = document.createElement('div');
        tileLayer.className = 'absolute';
        tileLayer.style.top = paddingSize + 'px';
        tileLayer.style.left = paddingSize + 'px';
        tileLayer.style.pointerEvents = 'none';
        container.appendChild(tileLayer);

        board.forEach((row, r) => {
            row.forEach((val, c) => {
                if(val !== 0) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.style.width = cellSize + 'px';
                    tile.style.height = cellSize + 'px';
                    tile.style.top = r * (cellSize + gapSize) + 'px';
                    tile.style.left = c * (cellSize + gapSize) + 'px';
                    
                    // 動態調整 Emoji 和愛心尺寸
                    const emojiClass = currentSize > 10 ? 'text-[8px]' : (currentSize > 8 ? 'text-sm' : (currentSize > 5 ? 'text-xl' : 'text-3xl'));
                    
                    // 📍 本次更新：動態調整愛心和數字的放大比例
                    // 核心邏輯：在 16x16 (currentSize=16) 時，基礎尺寸設為 10px，縮放 0.8。其餘模式動態放大。
                    let heartBaseSize = '28px'; // 4x4, 5x5 的基礎愛心尺寸 (原為 24px)
                    let heartFontSize = '12px'; // 4x4, 5x5 的基礎數字尺寸
                    let heartScale = '0.9';

                    if (currentSize > 5) { // 8x8
                        heartBaseSize = '20px';
                        heartFontSize = '9px';
                        heartScale = '0.85';
                    }
                    if (currentSize > 8) { // 16x16
                        heartBaseSize = '12px'; // 放大了
                        heartFontSize = '7.5px'; // 放大了，原為 6px
                        heartScale = '0.8';
                    }

                    tile.innerHTML = `
                        <div class="tile-inner">
                            <span class="${emojiClass}">${pikminData[val]}</span>
                            <div class="heart-container" style="font-size: ${heartBaseSize}">
                                <i class="fas fa-heart text-pink-300"></i>
                                <span class="absolute text-white font-black" style="font-size: ${heartFontSize}; transform: translate(-50%, -55%) scale(${heartScale}); left: 50%; top: 50%; width: 100%; text-align: center;">
                                    ${val < 1000 ? val : (val/1024).toFixed(0)+'K'}
                                </span>
                            </div>
                        </div>
                    `;
                    tileLayer.appendChild(tile);
                }
            });
        });
        document.getElementById('score').innerText = score;
        
        // 更新最高紀錄卡片
        const currentBest = localStorage.getItem(`pikmin_2048_best_${currentSize}`) || 0;
        if (score > currentBest) {
            localStorage.setItem(`pikmin_2048_best_${currentSize}`, score);
            document.getElementById('best-score').innerText = score;
        }

        localStorage.setItem(`pikmin_save_super_${currentSize}`, JSON.stringify({board, score, history}));
    }

    function move(dir) {
        if(document.getElementById('screen-game').classList.contains('active') === false) return;

        let prevBoard = JSON.stringify(board);
        let historyBoard = JSON.parse(prevBoard);
        let historyScore = score;

        const isVertical = dir.includes('Up') || dir.includes('Down');
        const isReverse = dir.includes('Right') || dir.includes('Down');

        for (let i = 0; i < currentSize; i++) {
            let line = [];
            for (let j = 0; j < currentSize; j++) {
                let val = isVertical ? board[j][i] : board[i][j];
                if (val !== 0) line.push(val);
            }
            if (isReverse) line.reverse();
            
            let newLine = [];
            for (let j = 0; j < line.length; j++) {
                if (line[j] === line[j + 1]) {
                    newLine.push(line[j] * 2);
                    score += line[j] * 2;
                    j++;
                } else {
                    newLine.push(line[j]);
                }
            }
            while (newLine.length < currentSize) newLine.push(0);
            if (isReverse) newLine.reverse();

            for (let j = 0; j < currentSize; j++) {
                if (isVertical) board[j][i] = newLine[j];
                else board[i][j] = newLine[j];
            }
        }

        if(JSON.stringify(board) !== prevBoard) {
            if(history.length > 20) history.shift();
            history.push({board: historyBoard, score: historyScore});
            addRandomTile();
            render();
            checkGameOver();
        }
    }

    function checkGameOver() {
        for(let r=0; r<currentSize; r++) {
            for(let c=0; c<currentSize; c++) {
                if(board[r][c] === 0) return;
                if(r < currentSize-1 && board[r][c] === board[r+1][c]) return;
                if(c < currentSize-1 && board[r][c] === board[r][c+1]) return;
            }
        }
        
        // 更新最高分紀錄
        saveRanking(currentSize, score);
        
        setTimeout(() => {
            const name = prompt(`遊戲結束！您的最終種植得分是 ${score}\n請輸入大名留念：`, "無名種植家");
            if(name) updateRankingName(currentSize, name, score);
            localStorage.removeItem(`pikmin_save_super_${currentSize}`);
            showScreen('screen-main');
        }, 300);
    }

    function saveRanking(size, s) {
        let ranks = JSON.parse(localStorage.getItem(`pikmin_super_ranks_${size}`)) || [];
        ranks.push({name: "臨時紀錄", score: s, date: new Date().toLocaleDateString()});
        ranks.sort((a,b) => b.score - a.score);
        localStorage.setItem(`pikmin_super_ranks_${size}`, JSON.stringify(ranks.slice(0, 10)));
    }

    function updateRankingName(size, name, s) {
        let ranks = JSON.parse(localStorage.getItem(`pikmin_super_ranks_${size}`)) || [];
        ranks.forEach(r => {
            if(r.score === s && r.name === "臨時紀錄") r.name = name;
        });
        localStorage.setItem(`pikmin_super_ranks_${size}`, JSON.stringify(ranks));
    }

    function showRankings() {
        showScreen('screen-rankings');
        updateRankDisplay(4);
    }

    function updateRankDisplay(size) {
        document.querySelectorAll('#screen-rankings button').forEach(b => {
            if(b.innerText.includes(size+'x'+size)) {
                b.classList.remove('bg-green-200', 'text-green-800');
                b.classList.add('bg-green-600', 'text-white', 'shadow');
            } else {
                b.classList.add('bg-green-200', 'text-green-800');
                b.classList.remove('bg-green-600', 'text-white', 'shadow');
            }
        });

        const ranks = JSON.parse(localStorage.getItem(`pikmin_super_ranks_${size}`)) || [];
        const content = document.getElementById('rank-content');
        content.innerHTML = ranks.length ? '' : '<div class="text-center text-gray-400 mt-16 font-bold">目前地圖尚無種植紀錄</div>';
        ranks.forEach((r, i) => {
            const dateStr = `<span class="text-xs text-gray-300 ml-1.5 font-normal">${r.date}</span>`;
            content.innerHTML += `
                <div class="flex justify-between items-center py-2.5 border-b border-green-50">
                    <span class="font-black text-lg text-green-800">${i+1}. ${r.name}</span>
                    <span class="text-green-900 font-black">${r.score < 10000 ? r.score : (r.score/1000).toFixed(0)+'K'}</span>
                </div>
            `;
        });
    }

    function undo() {
        if(history.length > 0) {
            const last = history.pop();
            board = last.board;
            score = last.score;
            render();
        }
    }

    // 控制邏輯
    let tsX, tsY;
    document.addEventListener('touchstart', e => { 
        // 確保不影響選單內的滾動
        if (e.target.closest('.grid-container')) {
            tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; 
        }
    }, {passive: false});
    document.addEventListener('touchend', e => {
        if(!tsX || !tsY) return;
        let dx = e.changedTouches[0].clientX - tsX;
        let dy = e.changedTouches[0].clientY - tsY;
        if(Math.abs(dx) > 30 || Math.abs(dy) > 30) {
            if(Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'Right' : 'Left');
            else move(dy > 0 ? 'Down' : 'Up');
        }
        tsX = null; tsY = null;
    }, {passive: false});
    window.addEventListener('keydown', e => move(e.key));

</script>
</body>
</html>
